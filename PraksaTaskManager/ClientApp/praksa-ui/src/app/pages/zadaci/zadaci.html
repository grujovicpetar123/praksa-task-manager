<div class="header">
      <h2>Zadaci</h2>
<button (click)="otvoriDijalog()">Dodaj</button>
<button (click)="prikaziRokNijeProsao()">Rok</button>
<button (click)="prikaziSveZadatke()">Svi</button>
</div>
<table mat-table [dataSource]="zadacis">
 
  <ng-container matColumnDef="id">
<th mat-header-cell *matHeaderCellDef>ID</th>
<td mat-cell *matCellDef="let zadatak">
      {{ zadatak.id }}
</td>
</ng-container>
 
  <ng-container matColumnDef="naziv">
<th mat-header-cell *matHeaderCellDef>Naziv</th>
<td mat-cell *matCellDef="let zadatak">
      {{ zadatak.naziv }}
</td>
</ng-container>
 
  <ng-container matColumnDef="opis">
<th mat-header-cell *matHeaderCellDef>Opis</th>
<td mat-cell *matCellDef="let zadatak">
      {{ zadatak.opis }}
</td>
</ng-container>
 <ng-container matColumnDef="rok">
<th mat-header-cell *matHeaderCellDef>Rok</th>
<td mat-cell *matCellDef="let zadatak">
      {{ zadatak.rok }}
</td>
</ng-container>

<ng-container matColumnDef="akcije">
<th mat-header-cell *matHeaderCellDef>Akcije</th>
<td mat-cell *matCellDef="let projekat">
      <button mat-icon-button (click)="obrisi(projekat.id)">
            <mat-icon>delete</mat-icon>
      </button>
</td>
</ng-container>

  <tr mat-header-row *matHeaderRowDef="kolone"></tr>
<tr mat-row *matRowDef="let row; columns: kolone;"></tr>
 
</table>
