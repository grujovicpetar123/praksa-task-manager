<button (click)="otvoriDijalog()">Dodaj</button>
<table mat-table [dataSource]="korisnicis">
 
  <ng-container matColumnDef="id">
<th mat-header-cell *matHeaderCellDef>ID</th>
<td mat-cell *matCellDef="let korisnik">
      {{ korisnik.id }}
</td>
</ng-container>
 
  <ng-container matColumnDef="ime">
<th mat-header-cell *matHeaderCellDef>Ime</th>
<td mat-cell *matCellDef="let korisnik">
      {{ korisnik.ime }}
</td>
</ng-container>
 
  <ng-container matColumnDef="prezime">
<th mat-header-cell *matHeaderCellDef>Prezime</th>
<td mat-cell *matCellDef="let korisnik">
      {{ korisnik.prezime }}
</td>
</ng-container>
 <ng-container matColumnDef="email">
<th mat-header-cell *matHeaderCellDef>Email</th>
<td mat-cell *matCellDef="let korisnik">
      {{ korisnik.email }}
</td>
</ng-container>
<ng-container matColumnDef="aktivan">
<th mat-header-cell *matHeaderCellDef>Aktivan</th>
<td mat-cell *matCellDef="let korisnik">
      {{ korisnik.aktivan }}
</td>
</ng-container>
  <tr mat-header-row *matHeaderRowDef="kolone"></tr>
<tr mat-row *matRowDef="let row; columns: kolone;"></tr>
 
</table>
