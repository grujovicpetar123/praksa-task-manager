<div class="header">
      <h2>Projekti</h2>
<button (click)="otvoriDijalog()">Dodaj</button>
<button (click)="prikaziSveProjekte()">Svi</button>
<button (click)="prikaziAktivneProjekte()">Aktivni</button>
</div>
<table mat-table [dataSource]="projektis">

    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let projekat">
            {{ projekat.id }}
        </td>
    </ng-container>

    <ng-container matColumnDef="naziv">
        <th mat-header-cell *matHeaderCellDef>Naziv</th>
        <td mat-cell *matCellDef="let projekat">
            {{ projekat.naziv }}
        </td>
    </ng-container>

    <ng-container matColumnDef="opis">
        <th mat-header-cell *matHeaderCellDef>Opis</th>
        <td mat-cell *matCellDef="let projekat">
            {{ projekat.opis }}
        </td>
    </ng-container>
    <ng-container matColumnDef="aktivan">
        <th mat-header-cell *matHeaderCellDef>Aktivan</th>
        <td mat-cell *matCellDef="let projekat">
            {{ projekat.aktivan }}
        </td>
    </ng-container>

    <ng-container matColumnDef="akcije">
<th mat-header-cell *matHeaderCellDef>Akcije</th>
<td mat-cell *matCellDef="let projekat">
      <button mat-icon-button (click)="obrisi(projekat.id)">
            <mat-icon>delete</mat-icon>
      </button>
</td>
</ng-container>


    <tr mat-header-row *matHeaderRowDef="kolone"></tr>
    <tr mat-row *matRowDef="let row; columns: kolone;"></tr>

</table>
